<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPOP NOTE · 日报 × 记录</title>
<style>
/* ============ KPOP NOTE · 日报×记录 · 浅色低饱和 ============ */
:root{
  --bg:#f6f4f1;--surface:#ffffff;--surface-2:#fbfaf7;
  --ink:#3b3a40;--muted:#8b8794;--line:#e9e6ee;
  --acc1:#8d7bb8;--acc1-soft:#f0ecf9;
  --acc2:#c98ba6;--acc2-soft:#faf0f4;
  --teal:#6f9e93;--teal-soft:#eaf3f0;
  --danger:#c0707a;--gold:#d99f3a;
  --r-lg:18px;--r-md:12px;--r-sm:8px;
  --shadow-hover:0 14px 30px rgba(93,80,140,.10);
  --shadow-float:0 20px 44px rgba(93,80,140,.16);
  --font:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:13px;color:var(--ink)}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:24px;padding:14px 28px;background:rgba(246,244,241,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:280px}
.logo{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--acc1) 0%,var(--acc2) 100%);color:#fff;font-weight:500;font-size:18px}
.brand h1{font-size:15px;font-weight:500;letter-spacing:.2px}
.brand h1 em{font-style:normal;color:var(--muted)}
.brand p{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex:1}
.tab{border:none;background:transparent;color:var(--muted);font-size:13px;padding:8px 16px;border-radius:999px;transition:all .25s ease}
.tab:hover{background:var(--surface);color:var(--ink);transform:translateY(-1px)}
.tab.active{background:var(--surface);color:var(--acc1);font-weight:500;box-shadow:0 6px 16px rgba(93,80,140,.10)}
.topbar-right{display:flex;align-items:center;gap:10px}
.db-badge{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--teal);background:var(--teal-soft);border:1px solid var(--line);padding:4px 12px;border-radius:999px;white-space:nowrap}
.db-badge.local{color:var(--muted);background:var(--surface-2)}
.db-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--teal)}
.db-badge.local .dot{background:var(--muted)}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.status.off .dot{background:var(--danger)}
main{max-width:1180px;margin:0 auto;padding:22px 28px 60px}
.view{display:none}
.view.active{display:block}
.hero{border-radius:var(--r-lg);padding:26px 30px;margin-bottom:20px;background:linear-gradient(135deg,var(--acc1-soft) 0%,var(--acc2-soft) 55%,#eef5f2 100%);border:1px solid var(--line)}
.hero-kicker{font-size:12px;color:var(--acc1);font-weight:500;letter-spacing:.5px}
.hero h2{font-size:17px;font-weight:500;margin:6px 0 12px;color:var(--ink)}
.flash-row{display:flex;flex-wrap:wrap;gap:8px}
.flash{font-size:11px;color:var(--muted);background:rgba(255,255,255,.65);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.news-sec{margin-bottom:22px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.sec-head h3{font-size:14px;font-weight:500;color:var(--ink)}
.sec-head .cnt{font-size:11px;color:var(--muted)}
.news-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.item-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;transition:transform .25s ease,box-shadow .25s ease;display:flex;flex-direction:column;gap:8px}
.item-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.item-top{display:flex;align-items:center;gap:8px}
.src{font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
.item-title{font-size:13px;font-weight:500;line-height:1.5;color:var(--ink)}
.item-sum{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.groups{display:flex;flex-wrap:wrap;gap:4px}
.grp{font-size:10px;color:var(--teal);background:var(--teal-soft);padding:2px 8px;border-radius:999px}
.btn-add-ev{border:none;background:var(--teal-soft);color:var(--teal);font-size:11px;padding:5px 12px;border-radius:999px;transition:all .25s ease}
.btn-add-ev:hover{background:var(--teal);color:#fff;transform:translateY(-1px);box-shadow:0 6px 14px rgba(111,158,147,.3)}
.side-col{position:sticky;top:86px}
.sched-card{padding:18px 20px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-head h3{font-size:14px;font-weight:500}
.event-list{display:flex;flex-direction:column;gap:8px}
.evt{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 12px;transition:transform .2s ease,box-shadow .2s ease}
.evt:hover{transform:translateX(2px);box-shadow:var(--shadow-hover)}
.evt-date{font-size:11px;color:var(--acc1);font-weight:500;min-width:74px}
.evt-body{flex:1;min-width:0}
.evt-title{font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evt-sub{font-size:10px;color:var(--muted)}
.evt.due{border-color:var(--acc2);background:var(--acc2-soft)}
.evt.due .evt-date{color:var(--acc2)}
.evt-del{border:none;background:transparent;color:var(--line);font-size:13px;padding:2px 6px;border-radius:6px;opacity:0;transition:all .2s ease}
.evt:hover .evt-del{opacity:1;color:var(--danger)}
.evt-del:hover{background:var(--danger);color:#fff}
.hint{font-size:11px;color:var(--muted);margin-top:8px}
.chart-bar{margin-top:20px;padding:18px 22px}
.chart-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.crow{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:7px 12px;font-size:12px;transition:transform .2s ease,box-shadow .2s ease}
.crow:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.rank{font-size:11px;color:var(--acc1);font-weight:500;min-width:26px}
.crow .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .a{color:var(--muted);font-size:11px}
.muted{font-size:11px;color:var(--muted)}
.meta-line{margin-bottom:10px}
.placeholder{padding:40px 30px;border:1px dashed var(--line);text-align:center}
.placeholder h3{font-size:14px;font-weight:500;margin-bottom:8px}
.placeholder p{font-size:12px;color:var(--muted);max-width:420px;margin:0 auto}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;padding:6px 14px;border-radius:999px;transition:all .22s ease}
.chip:hover{transform:translateY(-1px);box-shadow:var(--shadow-hover);color:var(--ink)}
.chip.active{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;border:none;box-shadow:0 6px 16px rgba(141,123,184,.28)}
#btn-add-item{margin-left:auto}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.item-card2{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s ease,box-shadow .25s ease}
.item-card2:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.ithumb{position:relative;width:100%;height:130px;min-height:130px;max-height:130px;background:linear-gradient(135deg,var(--acc1-soft),var(--acc2-soft));display:flex;align-items:center;justify-content:center;overflow:hidden}
.ithumb .ph{font-size:30px;color:var(--acc1);font-weight:500;opacity:.55}
.ithumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.icard-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.icard-top{display:flex;align-items:center;gap:6px}
.badge{font-size:10px;padding:2px 9px;border-radius:999px;font-weight:500}
.st-wish{background:var(--acc2-soft);color:var(--acc2)}
.st-order{background:var(--acc1-soft);color:var(--acc1)}
.st-owned{background:var(--teal-soft);color:var(--teal)}
.st-sold{background:var(--surface-2);color:var(--muted)}
.ikind{font-size:10px;color:var(--muted);margin-left:auto}
.iname{font-size:13px;color:var(--ink);line-height:1.45}
.iname .sep{color:var(--line)}
.iname b{font-weight:500}
.iver{font-size:11px;color:var(--acc1)}
.imeta{font-size:11px;color:var(--muted)}
.iprice{display:flex;align-items:baseline;gap:6px;margin-top:2px;flex-wrap:wrap}
.iamt{font-size:13px;font-weight:550;color:var(--ink)}
.iorig{font-size:10px;color:var(--muted)}
.inote{font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding-top:5px;margin-top:2px}
.icard-actions{display:flex;gap:6px;padding:0 14px 12px}
.mini{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:11px;padding:4px 12px;border-radius:999px;transition:all .2s ease}
.mini:hover{transform:translateY(-1px)}
.mini.edit:hover{background:var(--acc1-soft);color:var(--acc1);border-color:var(--acc1)}
.mini.del:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.con-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.con-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s ease,box-shadow .25s ease}
.con-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.cthumb{position:relative;width:100%;height:120px;min-height:120px;max-height:120px;background:linear-gradient(135deg,var(--teal-soft),var(--acc1-soft));display:flex;align-items:center;justify-content:center;overflow:hidden}
.cthumb .cph{font-size:30px;color:var(--teal);font-weight:500;opacity:.55}
.cthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ccard-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.ccard-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.cgroup{font-size:11px;font-weight:500;color:var(--teal);background:var(--teal-soft);padding:2px 9px;border-radius:999px}
.cmood{font-size:12px;color:var(--gold);letter-spacing:1px;white-space:nowrap}
.ctitle{font-size:13px;color:var(--ink);font-weight:500;line-height:1.45}
.cmeta{font-size:11px;color:var(--muted)}
.cpriceline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:2px}
.cprice{font-size:12px;font-weight:550;color:var(--ink)}
.corig{font-size:10px;color:var(--muted)}
.cexp{font-size:11px;color:var(--acc1);background:var(--acc1-soft);padding:2px 8px;border-radius:999px}
.cset{font-size:11px;color:var(--muted)}
.crev{font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding-top:5px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.exp-wrap{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.exp-row{display:grid;grid-template-columns:84px 1fr 1fr 58px 1.2fr 28px;gap:6px;align-items:center}
.exp-row select,.exp-row input{margin-top:0;padding:7px 8px;font-size:12px}
.exp-row .exp-del{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:6px;font-size:12px;height:33px;transition:all .2s ease}
.exp-row .exp-del:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:12px;padding:7px 14px;border-radius:999px;transition:all .25s ease;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-hover)}
.btn.primary{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;border:none;font-weight:500}
.btn.primary:hover{box-shadow:0 10px 22px rgba(141,123,184,.35)}
.btn.ghost{background:transparent;border:none;color:var(--muted);font-size:13px}
.btn.small{padding:4px 12px;font-size:11px;color:var(--acc1);border-color:var(--acc1)}
.btn.primary.small{color:#fff;border:none}
.modal-mask{position:fixed;inset:0;background:rgba(59,58,64,.35);backdrop-filter:blur(3px);z-index:50;display:none;align-items:center;justify-content:center}
.modal-mask:not([hidden]){display:flex}
.modal{width:520px;max-width:94vw;padding:22px 26px;animation:pop .25s ease}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.form-row{margin-bottom:14px}
.form-row.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.form-row label em{font-style:normal;color:var(--acc2);font-size:10px;margin-left:4px}
.form-row input,.form-row select,.form-row textarea{width:100%;margin-top:4px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);outline:none;transition:border .2s ease}
.form-row textarea{font-family:inherit;font-size:13px;line-height:1.5;resize:vertical}
.form-row textarea:focus,.form-row input:focus,.form-row select:focus{border-color:var(--acc1)}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:10px 20px;border-radius:999px;box-shadow:var(--shadow-float);z-index:99}
/* 账本 */
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kpi-row{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.kpi-label{font-size:11px;color:var(--muted)}
.kpi-val{font-size:22px;font-weight:550;color:var(--ink)}
.ledger-donut,.ledger-monthly,.ledger-budget,.ledger-year{padding:18px 20px}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{position:relative;width:160px;height:160px;border-radius:50%;flex:0 0 auto}
.donut-hole{position:absolute;inset:26px;background:var(--surface);border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;font-weight:550;color:var(--ink)}
.legend{list-style:none;display:flex;flex-direction:column;gap:8px;flex:1;min-width:160px;margin:0}
.legend li{display:flex;align-items:center;gap:8px;font-size:12px}
.lg-dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.lg-name{color:var(--ink);flex:1}
.lg-val{color:var(--ink);font-weight:500}
.lg-pct{color:var(--muted);min-width:38px;text-align:right}
.bars{display:flex;align-items:flex-end;gap:10px;min-height:178px;padding-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.bar{width:100%;max-width:42px;background:linear-gradient(180deg,var(--acc1),var(--acc2));border-radius:8px 8px 0 0;min-height:3px;transition:height .4s ease}
.bar-x{font-size:10px;color:var(--muted)}
.bar-v{font-size:10px;color:var(--ink)}
.budget-line{display:flex;justify-content:space-between;font-size:12px;color:var(--ink);margin-bottom:8px}
.budget-bar{height:12px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.budget-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--acc1));border-radius:999px;transition:width .4s ease}
.year-list{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted);margin:0}
.year-list b{color:var(--ink);font-weight:550}
@media (max-width:900px){
  .home-grid{grid-template-columns:1fr}
  .side-col{position:static}
  .tabs{order:3;width:100%;justify-content:center}
  .news-grid{grid-template-columns:1fr}
  .chart-list{grid-template-columns:1fr}
  .item-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .topbar{flex-wrap:wrap;gap:10px}
  .ledger{grid-template-columns:1fr}
  .kpi-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">N</span>
    <div class="brand-txt">
      <h1>KPOP NOTE <em>· 日报 × 记录</em></h1>
      <p>日程 · 收藏 · Con 记忆 · 追星账本</p>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="daily">日报</button>
    <button class="tab" data-view="items">收藏</button>
    <button class="tab" data-view="cons">Con 记忆</button>
    <button class="tab" data-view="ledger">账本</button>
  </nav>
  <div class="topbar-right">
    <span class="db-badge local" id="db-badge"><span class="dot"></span><span id="db-txt">本地存储</span></span>
    <div class="status" id="status"><span class="dot"></span>示例日报</div>
  </div>
</header>

<main>
  <section id="view-daily" class="view active">
    <div class="hero">
      <div class="hero-txt">
        <p class="hero-kicker" id="hero-date">加载中…</p>
        <h2 id="hero-lead">正在载入日报…</h2>
        <div class="flash-row" id="flashes"></div>
      </div>
    </div>
    <div class="home-grid">
      <div class="news-col"><div id="news-sections"></div></div>
      <aside class="side-col">
        <div class="card sched-card">
          <div class="card-head"><h3>日程区</h3><button class="btn small" id="btn-add-event">＋ 新增</button></div>
          <div id="event-list" class="event-list"></div>
          <p class="hint" id="event-hint">还没有日程，点「＋ 新增」或从日报一键加入。</p>
        </div>
      </aside>
    </div>
    <div class="chart-bar card">
      <div class="card-head"><h3 id="chart-title">数据 · 榜单</h3></div>
      <p class="muted meta-line" id="chart-meta"></p>
      <div id="chart-list" class="chart-list"></div>
    </div>
  </section>

  <section id="view-items" class="view">
    <div class="toolbar">
      <div class="filters" id="item-status-filters">
        <button class="chip active" data-status="all">全部</button>
        <button class="chip" data-status="wishlist">种草</button>
        <button class="chip" data-status="ordered">在途</button>
        <button class="chip" data-status="owned">已到手</button>
        <button class="chip" data-status="sold">已出物</button>
      </div>
      <div class="filters" id="item-kind-filters">
        <button class="chip active" data-kind="all">全部</button>
        <button class="chip" data-kind="album">专辑</button>
        <button class="chip" data-kind="photocard">小卡</button>
        <button class="chip" data-kind="merch">周边</button>
        <button class="chip" data-kind="other">其他</button>
      </div>
      <button class="btn primary small" id="btn-add-item">＋ 新增</button>
    </div>
    <div id="item-list" class="item-grid"></div>
    <p class="hint" id="item-hint" style="display:none">还没有收藏记录，点「＋ 新增收藏」开始记录。</p>
  </section>

  <section id="view-cons" class="view">
    <div class="toolbar">
      <div class="filters" id="con-group-filters"><button class="chip active" data-group="all">全部</button></div>
      <button class="btn primary small" id="btn-add-con">＋ 新增</button>
    </div>
    <div id="con-list" class="con-grid"></div>
    <p class="hint" id="con-hint" style="display:none">还没有 Con 记录，点「＋ 新增」记录你的第一场演出。</p>
  </section>

  <section id="view-ledger" class="view">

<script>
'use strict';
/* ================================================================
   KPOP NOTE · 日报 × 记录  ——  资料库双向同步版
   数据层策略（四级适配）：
   ① 资料库平台注入 API（window.__WB_DATA__ 等，平台环境自动命中）
   ② 同源 CSV 数据表（发布后由资料库托管，可通过相对路径读取）
   ③ localStorage 本地降级（键 wb_kpop_note_v1，任何环境可用）
   ④ 导出/导入 JSON + CSV 手工兜底（账本页按钮）
   在资料库打开时，页面与在线表格双向同步；未接入时自动降级本地，
   功能完整可用。
================================================================ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- 数据层 ---------- */
const DB = (() => {
  const KEY = 'wb_kpop_note_v1';
  const g = typeof window !== 'undefined' ? window : globalThis;
  // 探测资料库注入的同步运行时（多种常见命名，防御式探测）
  let cloud = null;
  try {
    const cand = [g.__WB_DATA__, g.__WB_LIBRARY__, g.__wbSync__, g.WBLibrary, (g.parent && g.parent.__WB_DATA__), (g.parent && g.parent.__WB_LIBRARY__)];
    for (const c of cand) {
      if (c && typeof c === 'object' && (typeof c.load === 'function' || typeof c.get === 'function' || typeof c.read === 'function')) { cloud = c; break; }
    }
  } catch (e) { cloud = null; }
  let mode = 'local';

  async function load() {
    if (cloud) {
      try {
        const v = await (cloud.load ? cloud.load(KEY) : cloud.get(KEY));
        if (v) { mode = 'cloud'; return JSON.parse(v); }
      } catch (e) {}
      try {
        const r = await fetch('./kpop-note-data.csv', { cache: 'no-store' });
        if (r.ok) {
          const txt = await r.text();
          const obj = csvToData(txt);
          if (obj && (obj.events || obj.items || obj.cons)) { mode = 'cloud'; return obj; }
        }
      } catch (e) {}
    }
    try {
      const ls = localStorage.getItem(KEY);
      if (ls) { mode = 'local'; return JSON.parse(ls); }
    } catch (e) {}
    return null;
  }
  async function save(data) {
    const txt = JSON.stringify(data);
    let saved = 'local';
    if (cloud) {
      try { await (cloud.save ? cloud.save(KEY, txt) : cloud.set(KEY, txt)); saved = 'cloud'; } catch (e) {}
    }
    try { localStorage.setItem(KEY, txt); } catch (e) {}
    mode = saved;
    return saved;
  }
  function badge(el, el2) {
    const on = mode === 'cloud';
    const b = $('#db-badge'); b.classList.toggle('local', !on);
    $('#db-txt').textContent = on ? '云端同步' : '本地存储';
    if (el2) el2.textContent = on ? '云端同步' : '本地存储';
  }
  return { load, save, badge, get mode() { return mode; }, get cloud() { return !!cloud; } };
})();

/* ---------- CSV 工具 ---------- */
function csvCell(v) {
  v = String(v == null ? '' : v);
  return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function toCSV(rows) { // rows: 对象数组，键序取首个对象
  if (!rows.length) return '';
  const head = Object.keys(rows[0]);
  const lines = [head.join(',')];
  rows.forEach(r => lines.push(head.map(h => csvCell(r[h])).join(',')));
  return lines.join('\r\n');
}
function csvParse(text) {
  const rows = []; let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); cur = ''; rows.push(row); row = [];
    } else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  if (!rows.length) return [];
  const head = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => {
    const o = {};
    head.forEach((h, j) => { o[h] = (r[j] == null ? '' : r[j]).trim(); });
    return o;
  });
}
function download(name, content, type) {
  const blob = new Blob([content], { type: type || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
const CSV_COLS = {
  events: ['group', 'type', 'title', 'startDate', 'endDate', 'location', 'ticketStatus', 'repeat', 'note'],
  items: ['kind', 'status', 'group', 'name', 'version', 'platform', 'purchasedDate', 'amount', 'originalAmount', 'originalCurrency', 'image', 'note'],
  cons: ['group', 'title', 'date', 'city', 'venue', 'seat', 'ticketPrice', 'mood', 'expenses', 'setlist', 'seatImage', 'review']
};
function dataToCSV(data) {
  const ev = (data.events || []).map(r => { const o = {}; CSV_COLS.events.forEach(k => o[k] = r[k]); return o; });
  const it = (data.items || []).map(r => { const o = {}; CSV_COLS.items.forEach(k => o[k] = r[k]); return o; });
  const co = (data.cons || []).map(r => {
    const o = {}; CSV_COLS.cons.forEach(k => o[k] = r[k]);
    if (r.expenses) o.expenses = JSON.stringify(r.expenses);
    if (r.setlist) o.setlist = JSON.stringify(r.setlist);
    return o;
  });
  return { events: toCSV(ev), items: toCSV(it), cons: toCSV(co) };
}
function csvToData(csvText) {
  // 期望合并 CSV：首列 table 字段区分三表；或单表导入
  const rows = csvParse(csvText);
  if (!rows.length) return null;
  const out = { events: [], items: [], cons: [] };
  const num = v => (v === '' || v == null) ? undefined : Number(v);
  rows.forEach(r => {
    const table = (r.table || '').trim();
    if (table === 'events') {
      out.events.push({
        group: r.group, type: r.type || 'other', title: r.title, startDate: r.startDate,
        endDate: r.endDate || undefined, location: r.location || undefined,
        ticketStatus: r.ticketStatus || undefined, repeat: r.repeat || 'none', note: r.note || undefined,
        id: r.id || uid(), createdAt: r.createdAt, updatedAt: r.updatedAt
      });
    } else if (table === 'items') {
      out.items.push({
        kind: r.kind || 'other', status: r.status || 'owned', group: r.group, name: r.name,
        version: r.version || undefined, platform: r.platform || undefined,
        purchasedDate: r.purchasedDate || undefined, amount: num(r.amount),
        originalAmount: r.originalAmount || undefined, originalCurrency: r.originalCurrency || undefined,
        image: r.image || undefined, note: r.note || undefined, id: r.id || uid()
      });
    } else if (table === 'cons') {
      let expenses, setlist;
      try { expenses = r.expenses ? JSON.parse(r.expenses) : undefined; } catch (e) { expenses = undefined; }
      try { setlist = r.setlist ? JSON.parse(r.setlist) : undefined; } catch (e) { setlist = undefined; }
      out.cons.push({
        group: r.group, title: r.title, date: r.date,
        city: r.city || undefined, venue: r.venue || undefined, seat: r.seat || undefined,
        ticketPrice: num(r.ticketPrice), mood: num(r.mood),
        expenses, setlist, seatImage: r.seatImage || undefined, review: r.review || undefined,
        id: r.id || uid()
      });
    }
  });
  if (!out.events.length && !out.items.length && !out.cons.length) return null;
  return out;
}

/* ---------- 状态与常量 ---------- */
const state = { data: null, daily: null, prefill: null, itemFilter: { status: 'all', kind: 'all' }, conFilter: { group: 'all' } };
const TYPE_LABEL = { comeback: '回归期', 'pre-release': '先行曲', album: '专辑', showcase: 'Showcase', tour: '巡演', birthday: '生日', anniversary: '周年', ticketing: '抢票日', other: '日程' };

/* ---------- 内嵌示例数据（由构建脚本注入） ---------- */

function renderDaily() {

/* ---------- 日程区 ---------- */
function nextDate(ev) {
  const base = ev.startDate || '';
  if (!base || !/^\d{4}-\d{2}-\d{2}/.test(base)) return null;
  if (ev.repeat === 'yearly') {
    const now = new Date();
    const d = new Date(now.getFullYear(), +base.slice(5, 7) - 1, +base.slice(8, 10));
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (d < today) d.setFullYear(now.getFullYear() + 1);
    return d;
  }
  return new Date(base.slice(0, 10) + 'T00:00:00');
}
function fmtMMDD(dt) { return `${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`; }
function renderEvents() {
  const list = $('#event-list'); list.innerHTML = '';
  const evs = (state.data.events || []).map(ev => ({ ev, nd: nextDate(ev) })).filter(x => x.nd).sort((a, b) => a.nd - b.nd);
  $('#event-hint').style.display = evs.length ? 'none' : 'block';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  evs.slice(0, 14).forEach(({ ev, nd }) => {
    const diff = Math.round((nd - today) / 86400000);
    const due = diff >= 0 && diff <= 7;
    const sub = [];
    if (ev.type) sub.push(TYPE_LABEL[ev.type] || ev.type);
    if (ev.location) sub.push(ev.location);
    if (ev.ticketStatus) sub.push(TICKET_LABEL[ev.ticketStatus] || ev.ticketStatus);
    const badge = due ? '7天内' : fmtMMDD(nd) + (ev.repeat === 'yearly' ? '·年' : diff < 0 ? '·已过' : '');
    const el = document.createElement('div'); el.className = 'evt' + (due ? ' due' : '');
    el.innerHTML = `<span class="evt-date">${esc(badge)}</span><div class="evt-body"><div class="evt-title">${esc(ev.title)}</div><div class="evt-sub">${esc(sub.join(' · '))}</div></div><button class="evt-del" data-id="${esc(ev.id)}" title="删除">✕</button>`;
    list.appendChild(el);
  });
}

/* ---------- 账本统计（本地计算） ---------- */
function computeStats(d) {
  const total = { v: 0 }, byCat = {}, monthly = {};
  const add = (amount, cat, ym) => {
    if (!amount) return;
    total.v += amount;
    byCat[cat] = Math.round(((byCat[cat] || 0) + amount) * 100) / 100;
    if (ym) monthly[ym] = Math.round(((monthly[ym] || 0) + amount) * 100) / 100;
  };
  (d.cons || []).forEach(c => {
    const tp = Number(c.ticketPrice) || 0;
    add(tp, '演出票', (c.date || '').slice(0, 7));
    (c.expenses || []).forEach(e => {
      if (e.type === 'ticket') { if (!tp) add(Number(e.amount) || 0, '演出票', (c.date || '').slice(0, 7)); return; }
      const key = ({ transport: '交通', hotel: '住宿', food: '餐饮', merch: '周边', other: '其他' })[e.type] || '其他';
      add(Number(e.amount) || 0, key, (c.date || '').slice(0, 7));
    });
  });
  (d.items || []).forEach(it => {
    if (it.status === 'wishlist' || it.status === 'sold') return;
    add(Number(it.amount) || 0, '专辑周边', (it.purchasedDate || '').slice(0, 7));
  });
  return {
    total: Math.round(total.v * 100) / 100, byCategory: byCat,
    monthly: Object.fromEntries(Object.entries(monthly).sort()),
    conCount: (d.cons || []).length,
    itemCount: (d.items || []).filter(x => x.status !== 'wishlist' && x.status !== 'sold').length
  };
}

    try {
      const obj = csvToData(await f.text());
      if (!obj) throw new Error('CSV 为空或格式不符');
      if (obj.events.length) state.data.events = obj.events;
      if (obj.items.length) state.data.items = obj.items;
      if (obj.cons.length) state.data.cons = obj.cons;
      await saveAll('已导入 CSV');
      renderEvents(); renderItems(); renderCons(); renderLedger();
    } catch (err) { toast('导入失败：' + err.message); }
  });
  $('#btn-reset-seed').addEventListener('click', async () => {
    if (!confirm('恢复示例数据？当前记录将被覆盖（可先导出备份）。')) return;
    state.data = clone(EMBED_SEED);
    await saveAll('已恢复示例数据');
    renderEvents(); renderItems(); renderCons(); renderLedger(); fillGroupList();
  });

  /* 事件委托 */
  document.addEventListener('click', async e => {
    const addBtn = e.target.closest('.btn-add-ev');
    if (addBtn) {
      openEventModal(null, { group: addBtn.dataset.group, cat: inferType(addBtn.dataset.cat, addBtn.dataset.title), title: addBtn.dataset.title, start: todayStr(), id: addBtn.dataset.id, url: addBtn.dataset.url });
      return;
    }
    const delBtn = e.target.closest('.evt-del');
    if (delBtn) {
      if (!confirm('删除这条日程？')) return;
      state.data.events = (state.data.events || []).filter(x => x.id !== delBtn.dataset.id);
      await saveAll('日程已删除'); renderEvents();
    }
    const conFilterChip = e.target.closest('#con-group-filters .chip');
    if (conFilterChip) {
      state.conFilter = { group: conFilterChip.dataset.group };
      $$('#con-group-filters .chip').forEach(x => x.classList.remove('active'));
      conFilterChip.classList.add('active');
      renderCons();
      return;
    }
    const editCon = e.target.closest('.con-card .mini.edit');
    if (editCon) { const c = (state.data.cons || []).find(x => x.id === editCon.dataset.id); if (c) openConModal(c); return; }
    const delCon = e.target.closest('.con-card .mini.del');
    if (delCon) {
      if (!confirm('删除这条 Con 记忆？')) return;
      state.data.cons = (state.data.cons || []).filter(x => x.id !== delCon.dataset.id);
      await saveAll('记忆已删除'); renderCons();
    }
    const expDel = e.target.closest('.exp-del');
    if (expDel) { expDel.closest('.exp-row').remove(); return; }
    const editItem = e.target.closest('.mini.edit');
    if (editItem) { const it = (state.data.items || []).find(x => x.id === editItem.dataset.id); if (it) openItemModal(it); return; }
    const delItem = e.target.closest('.mini.del');
    if (delItem) {
      if (!confirm('删除这条收藏？')) return;
      state.data.items = (state.data.items || []).filter(x => x.id !== delItem.dataset.id);
      await saveAll('收藏已删除'); renderItems();
    }
  });

  $('#event-form').addEventListener('submit', async e => {
    e.preventDefault();
    const rec = {
      group: $('#f-group').value.trim(), type: $('#f-type').value, title: $('#f-title').value.trim(),
      startDate: $('#f-start').value, endDate: $('#f-end').value || undefined,
      location: $('#f-location').value.trim() || undefined, ticketStatus: $('#f-ticket').value || undefined,
      repeat: $('#f-repeat').value, note: $('#f-note').value.trim() || undefined
    };
    if (state.prefill && state.prefill.id) rec.source = { type: 'daily', itemId: state.prefill.id, url: state.prefill.url, date: (state.daily || {}).date };
    const id = $('#f-id').value;
    if (id) { const i = (state.data.events || []).findIndex(x => x.id === id); if (i > -1) state.data.events[i] = Object.assign(state.data.events[i], rec); }
    else { rec.id = uid(); state.data.events = state.data.events || []; state.data.events.push(rec); }
    await saveAll(id ? '日程已更新' : '已加入日程'); renderEvents(); closeModal();
  });

  $('#item-form').addEventListener('submit', async e => {
    e.preventDefault();
    const rec = {
      kind: $('#i-kind').value, status: $('#i-status').value, group: $('#i-group').value.trim(), name: $('#i-name').value.trim(),
      version: $('#i-version').value.trim() || undefined, platform: $('#i-platform').value || undefined,
      purchasedDate: $('#i-date').value || undefined,
      amount: $('#i-amount').value ? Number($('#i-amount').value) : undefined,
      originalAmount: $('#i-orig').value ? $('#i-orig').value : undefined,
      originalCurrency: $('#i-origc').value.trim() || undefined,
      image: $('#i-image').value.trim() || undefined, note: $('#i-note').value.trim() || undefined
    };
    if (rec.originalAmount && !rec.originalCurrency) rec.originalCurrency = 'JPY';
    const id = $('#i-id').value;
    if (id) { const i = (state.data.items || []).findIndex(x => x.id === id); if (i > -1) state.data.items[i] = Object.assign(state.data.items[i], rec); }
    else { rec.id = uid(); state.data.items = state.data.items || []; state.data.items.push(rec); }
    await saveAll(id ? '收藏已更新' : '已保存收藏'); renderItems(); closeItemModal();
  });

  $('#con-form').addEventListener('submit', async e => {
    e.preventDefault();
    const expenses = readExpRows();
    const origAmount = $('#c-orig').value.trim();
    const origCur = $('#c-origc').value.trim();
    const setlistRaw = $('#c-setlist').value.trim();
    const rec = {
      group: $('#c-group').value.trim(), title: $('#c-title').value.trim(), date: $('#c-date').value,
      city: $('#c-city').value.trim() || undefined, venue: $('#c-venue').value.trim() || undefined,
      seat: $('#c-seat').value.trim() || undefined,
      ticketPrice: $('#c-price').value ? Number($('#c-price').value) : undefined,
      mood: $('#c-mood').value ? Number($('#c-mood').value) : undefined,
      expenses: expenses.length ? expenses : undefined,
      setlist: setlistRaw ? setlistRaw.split('\n').map(s => s.trim()).filter(Boolean) : undefined,
      seatImage: $('#c-image').value.trim() || undefined, review: $('#c-review').value.trim() || undefined
    };
    if (origAmount) { rec.ticketOriginal = { amount: origAmount }; if (origCur) rec.ticketOriginal.currency = origCur; }
    const id = $('#c-id').value;
    if (id) { const i = (state.data.cons || []).findIndex(x => x.id === id); if (i > -1) state.data.cons[i] = Object.assign(state.data.cons[i], rec); }
    else { rec.id = uid(); state.data.cons = state.data.cons || []; state.data.cons.push(rec); }
    await saveAll(id ? '记忆已更新' : '已保存记忆'); renderCons(); closeConModal();
  });

  $$('#item-status-filters .chip').forEach(c => c.addEventListener('click', () => {
    $$('#item-status-filters .chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active'); state.itemFilter.status = c.dataset.status; renderItems();
  }));
  $$('#item-kind-filters .chip').forEach(c => c.addEventListener('click', () => {
    $$('#item-kind-filters .chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active'); state.itemFilter.kind = c.dataset.kind; renderItems();
  }));
}

function fillGroupList() {
  const set = new Set();
  (state.data.profile.groups || []).forEach(g => set.add(g));
  ((state.daily || {}).sections || []).forEach(s => (s.items || []).forEach(it => (it.groups || []).forEach(g => set.add(g))));
  const dl = $('#group-list'); dl.innerHTML = '';
  [...set].sort().forEach(g => { const o = document.createElement('option'); o.value = g; dl.appendChild(o); });
}

/* ---------- 启动 ---------- */
async function init() {
  const seed = clone(EMBED_SEED || { version: '2.0', profile: { nickname: '', groups: [], budget: { year: new Date().getFullYear(), limit: 12000 } }, events: [], cons: [], items: [] });
  let data = null;
  try { data = await DB.load(); } catch (e) { data = null; }
  state.data = (data && (data.events || data.items || data.cons)) ? data : seed;
  state.daily = EMBED_DAILY;
  DB.badge();
  $('#db-txt2').textContent = DB.mode === 'cloud' ? '云端同步' : '本地存储';
  renderDaily(); renderEvents(); renderItems(); renderCons(); renderLedger(); fillGroupList(); bindStatic();
}
init();
</script>
</body>
</html>
